# Dependabot configuration for automatic flake.lock updates
#
# This keeps Nix flake inputs up-to-date automatically.
# Updates are checked weekly and PRs are created as needed.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Kyiv"
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Kyiv"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
