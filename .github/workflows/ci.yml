# CI workflow for NixOS-Niri
#
# Builds all NixOS configurations, Home Manager configurations,
# and dev shells. Runs on push to main/master and on PRs.
#
# Optional secrets:
#   CACHIX_AUTH_TOKEN — for pushing to the viitorags cachix cache.
#   Без секрета (форк, PR извне) шаг с Cachix просто пропускается.

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
  NIXPKGS_ALLOW_UNFREE: "1"

jobs:
  # Fast early-return: validate that the flake evaluates at all
  check:
    name: Evaluate flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Set up Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v16
        with:
          name: viitorags
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Check flake evaluation
        run: |
          nix flake check \
            --all-systems \
            --no-build \
            --accept-flake-config \
            --option tarball-ttl 0

  # Build every NixOS host defined in the flake
  build-nixos:
    name: Build NixOS [${{ matrix.host }}]
    needs:
      - check
      - discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.discover.outputs.hosts) }}

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Push to Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v16
        with:
          name: viitorags
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build NixOS toplevel (${{ matrix.host }})
        run: |
          nix build \
            ".#nixosConfigurations.\"${{ matrix.host }}\".config.system.build.toplevel" \
            --print-build-logs \
            --accept-flake-config \
            --option tarball-ttl 0

      - name: Report closure size
        run: |
          readlink result
          du -sh result/ 2>/dev/null || true

  # Build Home Manager activation package per host
  build-home:
    name: Build Home [${{ matrix.host }}]
    needs:
      - check
      - discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.discover.outputs.hosts) }}

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Push to Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v16
        with:
          name: viitorags
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Home Manager activation (${{ matrix.host }})
        run: |
          nix build \
            ".#nixosConfigurations.\"${{ matrix.host }}\".config.system.build.homeManagerBuild" \
            --print-build-logs \
            --accept-flake-config \
            --option tarball-ttl 0

  # Build all available dev shells
  build-devshells:
    name: Build dev shells
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Push to Cachix
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@v16
        with:
          name: viitorags
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build all dev shells
        run: |
          # Evaluate available shell names from the flake
          SHELLS=$(nix eval \
            ".#devShells.x86_64-linux" \
            --apply 'builtins.attrNames' \
            --json | jq -r '.[]')

          if [ -z "$SHELLS" ]; then
            echo "No dev shells found — skipping"
            exit 0
          fi

          for shell in $SHELLS; do
            echo "::group::Building dev shell: $shell"
            nix build \
              ".#devShells.x86_64-linux.\"$shell\"" \
              --print-build-logs \
              --accept-flake-config \
              --option tarball-ttl 0
            echo "::endgroup::"
          done

  # Discover hosts dynamically — replicates the logic from flake.nix
  discover:
    name: Discover hosts
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.set-hosts.outputs.hosts }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Discover NixOS hosts
        id: set-hosts
        run: |
          # Без 2>/dev/null: если eval падает, это должно быть видно в логе
          HOSTS=$(nix eval \
            ".#nixosConfigurations" \
            --apply 'builtins.attrNames' \
            --accept-flake-config \
            --json)

          echo "Discovered hosts: $HOSTS"
          echo "hosts=$HOSTS" >> "$GITHUB_OUTPUT"
